name: Hlidac aut

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Testovací běh (jen vypíše nalezené inzeráty)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hlidac
  cancel-in-progress: false

jobs:
  hlidej:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}

      - run: python -m playwright install --with-deps chromium

      - name: Hlidani
        run: python hlidac.py ${{ inputs.test && '--test' || '' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          SMS_TO: ${{ secrets.SMS_TO }}

      - name: Ulozit stav
        if: ${{ !inputs.test }}
        run: |
          git config user.name "hlidac-bot"
          git config user.email "hlidac-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "aktualizace seen.json" && git push)
